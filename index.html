<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Куда переехать — карта стран</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --ink:#18202a; --muted:#66707c; --line:#e2e7ec;
  --sea:#bfe1f6; --grat:#a9d3ee; --nodata:#c9c6c0; --accent:#0d8a6a; --accent-ink:#ffffff;
  --c0:#e0403a; --c1:#f5933a; --c2:#f7d548; --c3:#86cc5f; --c4:#13985a;
  --disputed:var(--nodata); --disputed-stroke:var(--stroke);
  --stroke:#ffffff; --shadow:0 10px 30px rgba(20,40,60,.16); --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1419; --panel:#182029; --ink:#e8edf2; --muted:#94a0ad; --line:#2a3440;
    --sea:#0e2c42; --grat:#163a54; --nodata:#4a525b; --accent:#34d399; --accent-ink:#06231a;
    --c0:#ef4a40; --c1:#f79a3e; --c2:#f2d34a; --c3:#7fcf58; --c4:#1fae66;
    --disputed:var(--nodata); --disputed-stroke:var(--stroke);
    --stroke:#0e2c42; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button,select{font:inherit;color:inherit}
.wrap{max-width:1680px;margin:0 auto;padding:10px 16px 8px;height:100vh;min-height:520px;display:flex;flex-direction:column}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.ttl{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;min-width:0}
h1{font-family:Unbounded,"Golos Text",sans-serif;font-weight:700;font-size:clamp(20px,2.2vw,28px);letter-spacing:-.02em;margin:0;line-height:1.1}
.sub{color:var(--muted);margin:0;font-size:14px}
.hdr-r{display:flex;align-items:center;gap:10px}
.how{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.lang{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:5px 11px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);transition:background .2s,color .2s}
.lang button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;flex:1;min-height:0}
#side{overflow-y:auto;min-height:0}
.mapbox{min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.panel h2{font-family:Unbounded,sans-serif;font-size:13px;font-weight:500;margin:0 0 2px}
.hint{color:var(--muted);font-size:12px;margin:0 0 8px}
.presets{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:5px 4px;font-size:12px;line-height:1.2;cursor:pointer;color:var(--muted);transition:all .2s}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.kids{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;user-select:none}
.kids input{appearance:none;-webkit-appearance:none;width:30px;height:17px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.kids input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.kids input:checked{background:var(--accent)}
.kids input:checked::after{transform:translateX(13px)}
.presets button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer;transition:all .2s}
.presets button:hover{border-color:var(--accent);color:var(--accent)}
.presets button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.f{padding:6px 0 3px;border-top:1px solid var(--line)}
.f-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.f-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:5px}
.info{width:18px;height:18px;border:0;background:none;padding:0;cursor:pointer;color:var(--muted);flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:5px}
.info:hover{background:var(--line);color:var(--ink)}
.info svg{width:9px;height:9px;transition:transform .25s}
.info[aria-expanded=true] svg{transform:rotate(180deg)}
.f-val{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted);white-space:nowrap}
.f-val b{color:var(--ink);font-size:13px}
.f-sub{font-size:11.5px;color:var(--muted);max-height:0;overflow:hidden;transition:max-height .25s ease, margin .25s}
.f-sub.on{max-height:60px;margin:2px 0 2px}
.f.off .f-name{color:var(--muted)}
.f.na .f-name{color:var(--muted)}
.cit{display:flex;align-items:center;gap:6px;margin:3px 0 1px;font-size:12px;color:var(--muted)}
.cit select{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 6px;font-size:12.5px;color:var(--ink)}
.cit.need select{border-color:var(--c1);box-shadow:0 0 0 2px color-mix(in srgb,var(--c1) 30%,transparent)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent) 0 var(--p,60%),var(--line) var(--p,60%) 100%)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--panel);border:3px solid var(--accent);margin-top:-6px;transition:transform .15s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--panel);border:3px solid var(--accent)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
input[type=range]:disabled{opacity:.4;cursor:not-allowed}

.mapbox{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.grat{fill:none;stroke:var(--grat);stroke-width:.6;vector-effect:non-scaling-stroke}
.country{stroke:var(--stroke);stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer}
circle.country{transform-box:fill-box;transform-origin:center;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.hovp{pointer-events:none;stroke:var(--ink);stroke-width:1.3;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35)) brightness(1.08) saturate(1.1);animation:pop .25s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes pop{from{transform:scale(1)}to{transform:scale(1.035)}}
.selp{pointer-events:none;stroke:var(--ink);stroke-width:2.2;vector-effect:non-scaling-stroke;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
circle.country.sel{stroke:var(--ink);stroke-width:2.2}
circle.country{stroke-width:1.3}
circle.country.hov{transform:scale(1.6)}
.hit{fill:transparent;cursor:pointer}
.disputed{fill:var(--disputed);stroke:var(--disputed-stroke);stroke-width:.7;vector-effect:non-scaling-stroke;cursor:default}

.ring{fill:none;stroke:var(--ink);pointer-events:none}
.pin{pointer-events:none}
.pin circle.core{fill:var(--ink);stroke:var(--panel);stroke-width:1.5}
.pin circle.halo{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.6;animation:halo 2.2s ease-out infinite}
.pin text{font:600 11px "Golos Text",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
@keyframes halo{0%{r:4;opacity:.7}100%{r:16;opacity:0}}

.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:7px 10px;font-size:13px;opacity:0;transition:opacity .15s;max-width:260px;z-index:7}
.tip.on{opacity:1}
.tip b{font-size:14px}
.tip .m{font-variant-numeric:tabular-nums;color:var(--muted)}
.legend{position:absolute;left:12px;bottom:12px;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11px;color:var(--muted);z-index:3}
.legend .bar{width:170px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--c0),var(--c1),var(--c2),var(--c3),var(--c4));margin:4px 0 3px}
.legend .row{display:flex;justify-content:space-between}
.legend .sw{display:flex;align-items:center;gap:6px;margin-top:4px}
.legend .sw i{width:13px;height:9px;border-radius:2px;display:inline-block}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoomctl button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:16px;line-height:1;box-shadow:var(--shadow)}

.float{position:absolute;top:12px;right:12px;width:300px;max-height:calc(100% - 24px);overflow:auto;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:opacity .35s,transform .4s cubic-bezier(.2,.8,.2,1);z-index:5}
.top{padding:9px 12px;opacity:0;transform:translateY(-10px)}
.top.on{opacity:1;transform:none}
.top.hide{opacity:0;transform:translateX(20px);pointer-events:none}
.top-h{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;min-height:22px}
.top-h h2{margin:0;line-height:22px;font-family:Unbounded,sans-serif;font-size:13px;font-weight:500}
.chev{display:inline-block;transition:transform .25s;color:var(--muted);font-size:12px}
.top.col .chev{transform:rotate(-90deg)}
.top ol{list-style:none;margin:6px 0 0;padding:0;overflow:hidden;transition:max-height .35s ease,margin .35s;max-height:600px}
.top.col ol{max-height:0;margin:0}
.top.col .empty{display:none}
.top li{display:grid;grid-template-columns:20px 1fr 30px;align-items:center;gap:6px;padding:4px 5px;border-radius:8px;cursor:pointer;transition:background .2s;font-size:13px}
.top li:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.top .i{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px}
.top .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .nm small{display:block;height:3px;border-radius:3px;margin-top:3px;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.top .pc{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.empty{color:var(--muted);font-size:13px;padding:6px 0}

.card{width:340px;padding:14px;opacity:0;transform:translateX(24px) scale(.98);pointer-events:none;background:var(--panel)}
.card.on{opacity:1;transform:none;pointer-events:auto}
.card .x{position:absolute;top:8px;right:8px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:8px}
.card .x:hover{background:var(--line)}
.card h3{font-family:Unbounded,sans-serif;font-weight:500;font-size:18px;margin:0 30px 2px 0;line-height:1.2}
.card .flag{font-size:24px;margin-right:6px;vertical-align:-3px}
.score{display:flex;align-items:center;gap:12px;margin:10px 0 6px}
.donut{width:68px;height:68px;flex:none}
.donut text{font:700 18px Unbounded,sans-serif;fill:var(--ink)}
.score .rk{font-size:12.5px;color:var(--muted)}
.score .rk b{display:block;font-size:14px;color:var(--ink)}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 2px;font-weight:600}
.cap{font-size:11.5px;color:var(--muted);margin:0 0 4px}
.acc{border-top:1px solid var(--line)}
.acc>button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:14px 1fr 90px 26px;align-items:center;gap:7px;font-size:13px;padding:6px 0;cursor:pointer}
.acc>button:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.acc .chev{font-size:10px}
.acc.open .chev{transform:rotate(90deg)}
.acc .track{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.acc .fill{height:100%;border-radius:4px;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.acc .n{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.acc.off>button{opacity:.5}
.acc .body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.acc.open .body{max-height:420px}
.ind{font-size:12px;display:grid;grid-template-columns:1fr auto;gap:1px 10px;padding:5px 0 5px 21px;border-top:1px dashed var(--line)}
.ind .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.ind .meta{grid-column:1/-1;color:var(--muted);font-size:11px}
.ind .meta em{font-style:normal;color:var(--ink)}
.ind.miss{color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:7px 9px;margin:6px 0 4px 21px}

.modal{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.modal.on{opacity:1;pointer-events:auto}
.modal .box{background:var(--panel);border-radius:18px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:24px 26px;position:relative;box-shadow:var(--shadow);transform:translateY(16px) scale(.98);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.modal.on .box{transform:none}
.modal h2{font-family:Unbounded,sans-serif;font-weight:500;font-size:20px;margin:0 30px 10px 0}
.modal h3{font-size:14px;margin:16px 0 6px}
.modal p,.modal li{font-size:14px;line-height:1.5;color:var(--ink)}
.modal .muted{color:var(--muted)}
.modal ul{padding-left:18px;margin:6px 0}
.modal table{width:100%;border-collapse:collapse;font-size:13px}
.modal td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
.modal td:first-child{font-weight:600;white-space:nowrap}
.modal a{color:var(--accent)}
.modal .x{position:absolute;top:12px;right:12px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);width:34px;height:34px;border-radius:8px}
footer{flex:none;margin-top:6px;font-size:11.5px;color:var(--muted);line-height:1.4}
footer a{color:var(--muted)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
@media (max-width:980px){
  .wrap{height:auto;display:block}
  .grid{grid-template-columns:1fr}
  .mapbox{height:62vw;min-height:280px}
  #side{overflow:visible}
  .sub{display:none}
  .card{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;max-height:70vh;border-radius:18px 18px 0 0;transform:translateY(40px)}
  .top{position:static;width:auto;margin:8px;max-height:none}
  .legend{position:static;margin:8px;display:inline-block}
  .zoomctl{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ttl">
      <h1 data-i="title">Куда переехать?</h1>
      <p class="sub" data-i="subtitle"></p>
    </div>
    <div class="hdr-r">
      <button class="how" id="howBtn" data-i="how"></button>
      <div class="lang" role="group" aria-label="Language">
        <button data-l="en">EN</button><button data-l="ru">RU</button><button data-l="es">ES</button>
      </div>
    </div>
  </header>

  <div class="grid">
    <aside class="panel" id="side">
      <h2 data-i="whatMatters"></h2>
      <p class="hint" data-i="sliderHint"></p>
      <div class="presets" id="presets"></div>
      <div id="sliders"></div>
    </aside>

    <section class="mapbox" id="mapbox">
      <svg id="map" role="img" aria-label="World map"></svg>
      <div class="loading" id="loading" data-i="loading"></div>
      <div class="tip" id="tip"></div>
      <div class="float top" id="top">
        <div class="top-h" id="topH"><h2 data-i="topTitle"></h2><span class="chev">▼</span></div>
        <div id="topList"></div>
      </div>
      <div class="float card" id="card" aria-live="polite"></div>
      <div class="legend">
        <div data-i="legendTitle"></div>
        <div class="bar"></div>
        <div class="row"><span data-i="legendLow"></span><span data-i="legendHigh"></span></div>
        <div class="sw"><i style="background:var(--nodata)"></i><span data-i="noData"></span></div>
      </div>
      <div class="zoomctl">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">−</button>
        <button id="zreset" aria-label="Reset">⟲</button>
      </div>
    </section>
  </div>

  <footer>
    <span data-i="sources"></span>
    <a href="https://data.worldbank.org" target="_blank" rel="noopener">World Bank (CC BY 4.0)</a> ·
    <a href="https://www.oecd.org/en/about/programmes/pisa.html" target="_blank" rel="noopener">OECD PISA 2025</a> ·
    <a href="https://www.indec.gob.ar" target="_blank" rel="noopener">INDEC</a> ·
    <a href="https://github.com/ilyankou/passport-index-dataset" target="_blank" rel="noopener">Passport Index dataset</a> ·
    <a href="https://github.com/topojson/world-atlas" target="_blank" rel="noopener">Natural Earth</a>.
    <span data-i="footNote"></span> <span id="gen"></span>
  </footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
(function(){
"use strict";
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const ORDER = ["legal","safety","cost","education","health","economy","labor","laws"];

/* ---------- texts ---------- */
const T = {
 en:{
  title:"Where should I move?", subtitle:"Set what matters to you — the map recolors every country to match.",
  how:"How it works", whatMatters:"What matters to you", sliderHint:"0 — ignore, 5 — very important",
  presets:{local:"Local job",remote:"Remote, foreign income",kids:"I have children"},
  loading:"Loading map…", legendTitle:"Match with your priorities", legendLow:"weak", legendHigh:"strong",
  noData:"not enough data", disputed:"disputed territory", disputedT:"Disputed territory",
  topTitle:"Best matches",
  match:"match", rank:"rank", of:"of", factors:"Factors",
  factorCap:"0–100: country's position among all countries (100 = best). Click a factor to see what's inside.",
  better:"better than {n}% of countries",
  noWeights:"Move at least one slider above 0.", notEnough:"Not enough data for your priorities",
  noVal:"no data", sources:"Sources:",
  footNote:"Prototype v0.4 · values not older than 2021 · not legal or migration advice.", generated:"Data:",
  citizenship:"Your citizenship", choose:"— choose —", needCit:"Choose your citizenship to use this factor",
  entry:"Entry for citizens of {c}", legalSoon:"Coming next: years to permanent residence and citizenship.",
  visaNoData:"Visa data not loaded yet (run extra_data.py).",
  visa:["entry not allowed","visa required","e-visa","electronic travel authorization (eTA)","visa on arrival","visa-free, under 30 days","visa-free, 30–89 days","visa-free, 90+ days","your own country"],
  f:{
   legal:["Ease of legal entry","visa regime for your passport"],
   safety:["Safety","homicides, political stability"],
   cost:["Low cost of living","price level vs. USA"],
   education:["Education quality","PISA 2025, university enrolment"],
   health:["Healthcare","life expectancy, access to care, infant mortality"],
   economy:["Economy","GDP per capita, growth, inflation"],
   labor:["Job market","unemployment, insecure jobs, employers' hiring plans"],
   laws:["Reliable laws","courts, property rights, corruption"]
  },
  ind:{
   homicides_100k:"Homicides per 100k people", political_stability_0_100:"Political stability (0–100)",

      ${k==="legal" ? `<div class="cit${VISA && !CIT ? " need":""}"><span>${t("citizenship")}</span><select id="cit" ${VISA?"":"disabled"}>${citizenshipOptions()}</select></div>` : ""}
      <input id="s_${k}" type="range" min="0" max="5" step="1" value="${W[k]}" style="--p:${W[k]*20}%" aria-valuetext="${W[k]} / 5">`;
    const inp = d.querySelector("input[type=range]");
    inp.addEventListener("input", () => {

    const ib = d.querySelector(".info"), sb = d.querySelector(".f-sub");

/* ---------- map ---------- */
async function loadGeometry(){
  try{
    const r = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json");
    if(!r.ok) throw new Error(r.status);
    const topo = await r.json();
    return topojson.feature(topo, topo.objects.countries).features.map(f => {
      f.iso3 = f.id != null ? (DATA.num_to_iso3[String(f.id).padStart(3,"0")] || null) : null; return f; });
  }catch(e){ /* fall through */ }
  await new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/datamaps@0.5.9/dist/datamaps.world.min.js";
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
  const topo = window.Datamap.prototype.worldTopo;
  const key = Object.keys(topo.objects)[0];
  return topojson.feature(topo, topo.objects[key]).features.map(f => { f.iso3 = /^[A-Z]{3}$/.test(f.id) ? f.id : null; return f; });
}
function prepFeatures(raw){
  return raw.filter(f => f.iso3 !== "ATA" && String(f.id) !== "010").map(f => {
    const nm = f.properties && f.properties.name;
    const dkey = DISPUTED_FEATURES[f.iso3] ? f.iso3 : DISPUTED_NAMES[nm];
    if(dkey){ f.disputed = DISPUTED_FEATURES[dkey]; f.iso3 = null; }
    else if(PARENT[f.iso3]) f.iso3 = PARENT[f.iso3];
    return f;
  });
}
function polyFeature(coords){
  let f = {type:"Feature", geometry:{type:"Polygon", coordinates:[coords]}};
  if(d3.geoArea(f) > 2*Math.PI) f.geometry.coordinates = [coords.slice().reverse()];
  return f;
}

function setupMap(){
  svg = d3.select("#map");
  const box = $("#mapbox");
  width = Math.max(320, box.clientWidth);
  height = Math.max(260, box.clientHeight);
  const land = {type:"FeatureCollection", features};
  projection = d3.geoNaturalEarth1().fitExtent([[10,10],[width-10,height-10]], land);
  path = d3.geoPath(projection);
  svg.attr("viewBox", `0 0 ${width} ${height}`);
  svg.selectAll("*").remove();

  root = svg.append("g");
  gMap = root.append("g");
  gMap.append("path").datum(d3.geoGraticule10()).attr("class","grat").attr("d", path);
  gMap.selectAll("path.country").data(features.filter(f => !f.disputed)).join("path")
    .attr("class","country").attr("d", path).attr("fill", noDataColor).style("opacity", 0)
    .on("pointerenter", onEnter).on("pointermove", onMove).on("pointerleave", onLeave).on("click", onClick);
  // disputed: whole features + drawn areas, on top
  const disp = features.filter(f => f.disputed).map(f => ({f, n:f.disputed}))
    .concat(DISPUTED_AREAS.map(a => ({f: polyFeature(a.c), n: a.n})));
  areas = disp;
  gMap.selectAll("path.disputed").data(disp).join("path").attr("class","disputed").attr("d", d => path(d.f)).style("opacity",0)
    .on("pointerenter", function(ev,d){ d3.select(this).classed("hov",true); showTip(ev, d, true); })
    .on("pointermove", (ev,d) => showTip(ev, d, true))
    .on("pointerleave", function(){ d3.select(this).classed("hov",false); hideTip(); })
    .on("click", (ev) => { ev.stopPropagation(); ripple(ev); });

  const have = new Set(features.map(f => f.iso3));
  dots = DATA.countries.filter(c => !have.has(c.iso3) && DOTS[c.iso3]).map(c => ({iso3:c.iso3, xy:projection(DOTS[c.iso3])}));
  gDots = root.append("g");
  const dg = gDots.selectAll("g.dot").data(dots, d => d.iso3).join("g").attr("class","dot")
    .attr("transform", d => `translate(${d.xy})`);
  dg.append("circle").attr("class","country").attr("r", 4.5).attr("fill", noDataColor).style("opacity", 0);
  dg.append("circle").attr("class","hit").attr("r", 11)
    .on("pointerenter", function(ev,d){ d3.select(this.parentNode).select(".country").classed("hov",true); showTip(ev,d); })
    .on("pointermove", (ev,d) => showTip(ev,d))
    .on("pointerleave", function(){ d3.select(this.parentNode).select(".country").classed("hov",false); hideTip(); })
    .on("click", onClick);
  gSel = root.append("g"); gHover = root.append("g");
  gPins = root.append("g");
  gFx = svg.append("g");

  zoom = d3.zoom().scaleExtent([1, 12])
    .translateExtent([[-width*0.15, -height*0.12],[width*1.15, height*1.12]])
    .filter(ev => ev.type !== "wheel" && !ev.ctrlKey && !ev.button)
    .on("start", () => clearHover())
    .on("zoom", ev => {
      root.attr("transform", ev.transform);
      const s = 1/ev.transform.k;
      gDots.selectAll("g.dot").attr("transform", d => `translate(${d.xy})scale(${s})`);
      gPins.selectAll("g.pin").attr("transform", d => `translate(${d.xy})scale(${s})`);
      hideTip();
    });
  svg.call(zoom).on("dblclick.zoom", null);
  svg.node().addEventListener("wheel", onWheel, {passive:false});
  svg.on("pointerleave.clear", () => { clearHover(); hideTip(); });
  svg.on("click.bg", ev => { if(ev.target === svg.node() || ev.target.classList.contains("grat")) closeCard(); });

  // intro: countries appear in a west→east wave
  gMap.selectAll("path.country,path.disputed").transition("intro").duration(REDUCED?0:700)
    .delay(function(d){ const f = d.f || d; return REDUCED?0:(path.centroid(f)[0]/width)*900 + Math.random()*120; })
    .ease(d3.easeCubicOut).style("opacity", 1);
  gDots.selectAll("circle.country").transition("intro").duration(REDUCED?0:500).delay(REDUCED?0:1000).style("opacity",1);
}

// Trackpad: two-finger scroll pans, pinch (ctrl+wheel) zooms. Mouse wheel zooms.
function onWheel(ev){
  ev.preventDefault();
  const pt = d3.pointer(ev, svg.node());
  if(ev.ctrlKey){
    svg.call(zoom.scaleBy, Math.pow(2, -ev.deltaY * 0.012), pt); return;
  }
  const mouseLike = ev.deltaMode !== 0 || (ev.deltaX === 0 && Math.abs(ev.deltaY) >= 50 && Number.isInteger(ev.deltaY));
  if(mouseLike){
    svg.transition().duration(REDUCED?0:180).call(zoom.scaleBy, ev.deltaY < 0 ? 1.35 : 1/1.35, pt);
  } else {
    const k = d3.zoomTransform(svg.node()).k;
    const scale = width / svg.node().getBoundingClientRect().width;
    svg.call(zoom.translateBy, -ev.deltaX * scale / k, -ev.deltaY * scale / k);
  }
}

function update(animate){
  compute();
  const dur = animate && !REDUCED ? 650 : 0;
  gMap.selectAll("path.country").transition("fill").duration(dur)
    .delay(d => dur ? (path.centroid(d)[0]/width)*260 : 0)
    .attr("fill", d => colorOf(scores.get(d.iso3)));
  gDots.selectAll("circle.country").transition("fill").duration(dur)
    .delay(d => dur ? (d.xy[0]/width)*260 : 0)
    .attr("fill", d => colorOf(scores.get(d.iso3)));
  drawPins(); renderTop(); drawSel();
  if(selected) renderCard(selected, false);
}

function largestPart(f){
  if(f.geometry.type !== "MultiPolygon") return f;
  let best = f, ma = -1;
  f.geometry.coordinates.forEach(c => { const p = {type:"Polygon",coordinates:c}; const a = path.area(p); if(a>ma){ma=a; best=p;} });
  return best;
}
function featureOf(iso){ return features.find(x => x.iso3 === iso && !x.disputed); }
function drawPins(){
  const top = [...ranks].sort((a,b)=>a[1]-b[1]).slice(0,3).map(d=>d[0]);
  const items = top.map((iso,i) => {
    const f = featureOf(iso);
    if(!f){ const dt = dots.find(x => x.iso3 === iso); return dt ? {iso, i, xy: dt.xy} : null; }
    return {iso, i, xy: path.centroid(largestPart(f))};
  }).filter(Boolean);
  const k = d3.zoomTransform(svg.node()).k;
  const pins = gPins.selectAll("g.pin").data(items, d => d.iso);
  pins.exit().transition().duration(250).style("opacity",0).remove();
  const enter = pins.enter().append("g").attr("class","pin").style("opacity",0);
  enter.append("circle").attr("class","halo").attr("r",4);
  enter.append("circle").attr("class","core").attr("r",3.5);
  enter.append("text").attr("x",8).attr("y",4);
  const all = enter.merge(pins);
  all.attr("transform", d => `translate(${d.xy})scale(${1/k})`)
     .select("text").text(d => (d.i+1) + ". " + cname(byIso.get(d.iso)));
  all.transition().duration(REDUCED?0:400).style("opacity",1);
}

/* ---------- interactions ---------- */
const tip = $("#tip");
function showHover(d){
  gHover.selectAll("path").data([d]).join("path").attr("class","hovp").attr("d", path(d)).attr("fill", colorOf(scores.get(d.iso3)));
}
function clearHover(){ if(gHover) gHover.selectAll("*").remove(); svg && svg.selectAll("circle.country.hov").classed("hov", false); }
function onEnter(ev, d){ showHover(d); showTip(ev, d); }
function onMove(ev, d){ showTip(ev, d); }
function onLeave(){ clearHover(); hideTip(); }
function drawSel(){
  const f = selected && featureOf(selected);
  gSel.selectAll("path").data(f ? [f] : []).join("path").attr("class","selp").attr("d", d => path(d))
    .attr("fill", d => colorOf(scores.get(d.iso3)));
  gDots.selectAll("circle.country").classed("sel", d => d.iso3 === selected);
}
function hideTip(){ tip.classList.remove("on"); }
function showTip(ev, d, isDisputed){
  if(isDisputed){
    tip.innerHTML = `<b>${esc(d.n[lang])}</b><br><span class="m">${t("disputedT")}</span>`;
  } else {
    const c = byIso.get(d.iso3);
    const name = c ? cname(c) : (d.properties && d.properties.name) || "—";
    const s = scores.get(d.iso3), r = ranks.get(d.iso3);
    tip.innerHTML = `<b>${flag(c && c.iso2)} ${esc(name)}</b><br><span class="m">${
      s!=null ? `${t("match")} ${s}/100 · ${t("rank")} ${r} ${t("of")} ${ranks.n}` : (c ? t("notEnough") : t("noData"))}</span>`;
  }
  // keep the tooltip fully inside the map
  const box = $("#mapbox").getBoundingClientRect();
  tip.classList.add("on");
  const tw = tip.offsetWidth, th = tip.offsetHeight, pad = 8, off = 14;
  let x = ev.clientX - box.left + off, y = ev.clientY - box.top + off;
  if(x + tw > box.width - pad) x = ev.clientX - box.left - tw - off;
  if(y + th > box.height - pad) y = ev.clientY - box.top - th - off;
  x = Math.max(pad, Math.min(x, box.width - tw - pad));
  y = Math.max(pad, Math.min(y, box.height - th - pad));
  tip.style.transform = `translate(${x}px,${y}px)`;
}
function ripple(ev){
  if(REDUCED) return;
  const [x,y] = d3.pointer(ev, svg.node());
  [0,140].forEach(delay => gFx.append("circle").attr("class","ring").attr("cx",x).attr("cy",y).attr("r",2)
    .attr("stroke-width",2).style("opacity",.8)
    .transition().delay(delay).duration(700).ease(d3.easeCubicOut).attr("r",38).style("opacity",0).remove());
}
function onClick(ev, d){
  ev.stopPropagation(); ripple(ev);
  if(!byIso.get(d.iso3)) return;
  select(d.iso3, true);
}
function select(iso, zoomTo){
  selected = iso;
  drawSel();
  const f = featureOf(iso), dt = dots.find(x => x.iso3 === iso);
  if(zoomTo && f) zoomToFeature(f);
  else if(zoomTo && dt) zoomToPoint(dt.xy, 5);
  $("#top").classList.add("hide");
  renderCard(iso, true);
}
function cardOffset(){ return window.innerWidth > 980 ? 350 * (width / $("#mapbox").clientWidth) : 0; }
function zoomToPoint([cx,cy], k){
  const availW = width - cardOffset();
  svg.transition().duration(REDUCED?0:850).ease(d3.easeCubicInOut)
    .call(zoom.transform, d3.zoomIdentity.translate(availW/2 - k*cx, height/2 - k*cy).scale(k));
}
function zoomToFeature(f){
  const [[x0,y0],[x1,y1]] = path.bounds(largestPart(f));
  const availW = width - cardOffset();
  const k = Math.max(1, Math.min(6, 0.7 / Math.max((x1-x0)/availW, (y1-y0)/height)));
  zoomToPoint([(x0+x1)/2, (y0+y1)/2], k);
}
function closeCard(){
  selected = null; $("#card").classList.remove("on"); $("#top").classList.remove("hide");
  if(gSel) drawSel();
}
$("#zin").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.6);
$("#zout").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1/1.6);
$("#zreset").onclick = () => { closeCard(); svg.transition().duration(REDUCED?0:700).call(zoom.transform, d3.zoomIdentity); };
document.addEventListener("keydown", e => { if(e.key === "Escape"){ closeModal(); closeCard(); } });

/* ---------- card ---------- */
function fmtInd(key, v){
  if(key==="price_level_vs_usa") return nf(v*100,0) + "%";
  if(key==="gdp_pc_ppp") return "$" + nf(v,0);
  if(key==="manpower_neo") return (v>0?"+":"") + nf(v,0) + "%";
  if(["homicides_100k","gdp_growth","inflation","unemployment","vulnerable_employment","infant_mortality"].includes(key)) return nf(v,1);
  return nf(v,0);
}
function factorBody(c, k){
  if(k === "legal"){
    if(!VISA) return `<div class="note">${t("visaNoData")}</div>`;
    if(!legalOn()) return `<div class="note">${t("needCit")}</div>`;
    const code = visaCode(c.iso3), citC = byIso.get(CIT);
    const citName = citC ? cname(citC) : CIT;
    return `<div class="ind"><span>${t("entry").replace("{c}", esc(citName))}</span><span class="v">${code==null?t("noVal"):esc(t("visa")[code])}</span>
      <span class="meta">Passport Index dataset${VISA.date ? " · " + VISA.date : ""}</span></div>
      <div class="note">${t("legalSoon")}</div>`;
  }
  return DATA.factors[k].map(([ik]) => {
    const val = c.v && c.v[ik];
    if(!val) return `<div class="ind miss"><span>${t("ind")[ik]}</span><span class="v">—</span><span class="meta">${t("noVal")}</span></div>`;
    const src = (c.src && c.src[ik]) || DATA.indicators[ik].src;
    let extra = "";
    if(ik==="pisa" && c.pisa3) extra = ` · ${t("pisaParts")}: ${c.pisa3.join(" / ")}`;
    if(ik==="manpower_neo" && DATA.manpower_quarter) extra = ` · ${DATA.manpower_quarter}`;
    const p = c.p && c.p[ik];
    return `<div class="ind"><span>${t("ind")[ik]}</span><span class="v">${fmtInd(ik, val[0])}</span>
      <span class="meta">${p!=null ? `<em>${t("better").replace("{n}", p)}</em> · ` : ""}${t("year")} ${val[1]} · ${SRC[src]||src}${extra}</span></div>`;
  }).join("");
}
function renderCard(iso, animate){
  const c = byIso.get(iso); if(!c) return;
  const s = scores.get(iso), r = ranks.get(iso);
  const R = 27, C = 2*Math.PI*R, pct = s==null ? 0 : s/100;
  const acc = ORDER.map(k => {
    const fv = factor(c, k); const off = activeW(k) === 0;
    return `<div class="acc${off?" off":""}${openAcc.has(k)?" open":""}" data-k="${k}">
      <button aria-expanded="${openAcc.has(k)}"><span class="chev">▶</span><span>${t("f")[k][0]}</span>
      <span class="track"><span class="fill" style="display:block;background:${colorOf(fv)};width:${animate?0:(fv||0)}%" data-w="${fv==null?0:fv}"></span></span>
      <span class="n">${fv==null?"—":fv}</span></button>
      <div class="body">${factorBody(c, k)}</div></div>`;
  }).join("");
  const card = $("#card");
  card.innerHTML = `<button class="x" aria-label="Close">×</button>
    <h3><span class="flag">${flag(c.iso2)}</span>${esc(cname(c))}</h3>
    <div class="score">
      <svg class="donut" viewBox="0 0 68 68"><circle cx="34" cy="34" r="${R}" fill="none" stroke="var(--line)" stroke-width="8"/>
        <circle class="arc" cx="34" cy="34" r="${R}" fill="none" stroke="${colorOf(s)}" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${animate?C:C*(1-pct)}" transform="rotate(-90 34 34)" style="transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)"/>
        <text x="34" y="40" text-anchor="middle">${s==null?"—":s}</text></svg>
      <div class="rk">${s==null ? t("notEnough") : `${t("match")} ${s}/100<b>${t("rank")} ${r} ${t("of")} ${ranks.n}</b>`}</div>
    </div>
    <div class="sec">${t("factors")}</div><p class="cap">${t("factorCap")}</p>${acc}`;
  card.querySelector(".x").onclick = closeCard;
  card.querySelectorAll(".acc>button").forEach(b => b.onclick = () => {
    const a = b.parentNode, k = a.dataset.k, on = !a.classList.contains("open");
    a.classList.toggle("open", on); b.setAttribute("aria-expanded", on);
    on ? openAcc.add(k) : openAcc.delete(k);
  });
  card.classList.add("on");
  if(animate) requestAnimationFrame(() => requestAnimationFrame(() => {
    card.querySelectorAll(".fill").forEach(el => el.style.width = el.dataset.w + "%");
    const arc = card.querySelector(".arc"); if(arc) arc.style.strokeDashoffset = C*(1-pct);
  }));
}

    window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => {
      if(Math.abs(window.innerWidth - lastW) < 2 && window.innerWidth <= 980) return; lastW = window.innerWidth;
      const keep = selected; setupMap(); update(false); svg.selectAll(".country,.disputed").interrupt("intro").style("opacity",1);
      if(keep) select(keep, false); }, 250); });
  }catch(e){
    console.error(e);
    applyTexts();
    $("#loading").textContent = "Error: " + e.message;
  }
})();
})();
</script>
</body>
</html>
