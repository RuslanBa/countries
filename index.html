<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Куда переехать — карта стран</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1ea; --panel:#fffdf9; --ink:#1d2321; --muted:#6b706c; --line:#e3dccf;
  --sea:#e9e3d8; --grat:#ddd5c7; --nodata:#d9d4cc; --accent:#0f766e; --accent-ink:#ffffff;
  --c0:#c4553a; --c1:#e8a75b; --c2:#efe3b8; --c3:#69b3a2; --c4:#0b5d57;
  --stroke:#fffdf9; --shadow:0 10px 30px rgba(40,30,10,.12);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121615; --panel:#1a201e; --ink:#ecebe6; --muted:#9aa19c; --line:#2b3330;
    --sea:#161c1a; --grat:#222a27; --nodata:#2d3431; --accent:#2dd4bf; --accent-ink:#06231f;
    --c0:#b4472f; --c1:#c9843f; --c2:#8f8a62; --c3:#3f9c89; --c4:#5eead4;
    --stroke:#121615; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit}
.wrap{max-width:1480px;margin:0 auto;padding:18px 20px 28px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
h1{font-family:Unbounded,"Golos Text",sans-serif;font-weight:700;font-size:clamp(24px,3.2vw,40px);letter-spacing:-.02em;margin:0;line-height:1.05}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px;max-width:640px}
.lang{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);transition:background .2s,color .2s}
.lang button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font-family:Unbounded,sans-serif;font-size:14px;font-weight:500;margin:0 0 4px;letter-spacing:.01em}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.presets button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;transition:all .2s}
.presets button:hover{border-color:var(--accent);color:var(--accent)}
.presets button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.f{padding:9px 0;border-top:1px solid var(--line)}
.f:first-of-type{border-top:0}
.f-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.f-name{font-weight:600;font-size:14.5px}
.f-val{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);white-space:nowrap}
.f-val b{color:var(--ink);font-size:14px}
.f-sub{font-size:12px;color:var(--muted);margin:1px 0 6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--accent) 0 var(--p,60%),var(--line) var(--p,60%) 100%)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--panel);border:3px solid var(--accent);margin-top:-7px;transition:transform .15s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--panel);border:3px solid var(--accent)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.f.off .f-name{color:var(--muted)}
.scale-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}
.mapbox{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#map{display:block;width:100%;height:auto;touch-action:none}
.sphere{fill:var(--sea)}
.grat{fill:none;stroke:var(--grat);stroke-width:.6;vector-effect:non-scaling-stroke}
.country{stroke:var(--stroke);stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .28s cubic-bezier(.2,.8,.2,1),filter .28s}
.country.hov{transform:scale(1.035);filter:drop-shadow(0 4px 6px rgba(0,0,0,.35)) brightness(1.06);stroke:var(--ink);stroke-width:1.2}
circle.country{stroke-width:1.2}
circle.country.hov{transform:scale(1.7)}
.country.sel{stroke:var(--ink);stroke-width:2;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.country.dim{opacity:.45}
.ring{fill:none;stroke:var(--ink);pointer-events:none}
.pin circle.core{fill:var(--ink);stroke:var(--panel);stroke-width:1.5}
.pin circle.halo{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.6;animation:halo 2.2s ease-out infinite}
.pin text{font:600 11px "Golos Text",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px;pointer-events:none}
@keyframes halo{0%{r:4;opacity:.7}100%{r:16;opacity:0}}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 11px;font-size:13px;opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s;white-space:nowrap;z-index:5}
.tip.on{opacity:1;transform:none}
.tip b{font-size:14px}
.tip .m{font-variant-numeric:tabular-nums;color:var(--muted)}
.legend{position:absolute;left:14px;bottom:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;color:var(--muted)}
.legend .bar{width:180px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--c0),var(--c1),var(--c2),var(--c3),var(--c4));margin:4px 0 3px}
.legend .row{display:flex;justify-content:space-between}
.legend .nd{display:flex;align-items:center;gap:6px;margin-top:5px}
.legend .nd i{width:12px;height:8px;border-radius:2px;background:var(--nodata);display:inline-block}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:17px;line-height:1;box-shadow:var(--shadow)}
.card{position:absolute;top:12px;right:12px;width:340px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;opacity:0;transform:translateX(24px) scale(.98);pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1);z-index:6}
.card.on{opacity:1;transform:none;pointer-events:auto}
.card .x{position:absolute;top:8px;right:8px;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:8px}
.card .x:hover{background:var(--line)}
.card h3{font-family:Unbounded,sans-serif;font-weight:500;font-size:19px;margin:0 30px 2px 0;line-height:1.2}
.card .flag{font-size:26px;margin-right:6px;vertical-align:-3px}
.score{display:flex;align-items:center;gap:14px;margin:12px 0 10px}
.donut{width:74px;height:74px;flex:none}
.donut text{font:700 18px Unbounded,sans-serif;fill:var(--ink)}
.score .rk{font-size:13px;color:var(--muted)}
.score .rk b{display:block;font-size:15px;color:var(--ink)}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px;font-weight:600}
.fb{display:grid;grid-template-columns:1fr 120px 30px;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.fb .track{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.fb .fill{height:100%;border-radius:4px;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.fb .n{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.fb.off{opacity:.45}
.ind{font-size:12.5px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:5px 0;border-top:1px dashed var(--line)}
.ind .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.ind .meta{grid-column:1/-1;color:var(--muted);font-size:11px}
.note{font-size:12px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:10px}
.below{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-top:16px}
.top ol{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 22px}
.top li{display:grid;grid-template-columns:22px 1fr 42px;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;cursor:pointer;transition:background .2s;font-size:14px}
.top li:hover{background:var(--bg)}
.top .i{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.top .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .nm small{display:block;height:4px;border-radius:3px;margin-top:4px;background:var(--accent);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.top .pc{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.about p{font-size:13px;color:var(--muted);margin:6px 0;line-height:1.45}
.about a{color:var(--accent)}
footer{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.5}
footer a{color:var(--muted)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
@media (max-width:980px){
  .grid{grid-template-columns:1fr}
  .grid > .panel{order:2}
  .below{grid-template-columns:1fr}
  .card{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;max-height:70vh;border-radius:18px 18px 0 0;transform:translateY(40px)}
  .top ol{grid-template-columns:1fr}
  .legend{position:static;margin:8px;display:inline-block}
  .legend .bar{width:140px}
  .zoomctl{display:none}
  .grid > .panel{order:0}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>

</div>

/* ---------- state ---------- */
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const navLang = (navigator.language||"en").slice(0,2);
let lang = load("kp_lang", T[navLang] ? navLang : "en");
let W = Object.assign({}, PRESETS.equal, load("kp_w", {}));
let DATA, byIso = new Map(), scores = new Map(), ranks = new Map(), selected = null;
let features = [], dots = [], svg, gMap, gDots, gPins, gFx, path, projection, zoom, width = 1000, height = 520;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const t = k => T[lang][k];
const nf = (v, d) => new Intl.NumberFormat(lang, {maximumFractionDigits:d, minimumFractionDigits:0}).format(v);
let dn = null;
function cname(c){
  if(!c) return "";
  try{ if(!dn || dn._l !== lang){ dn = new Intl.DisplayNames([lang], {type:"region"}); dn._l = lang; }
       const n = c.iso2 && dn.of(c.iso2); if(n && n !== c.iso2) return n; }catch(e){}
  return c.name;
}
function flag(iso2){
  if(!iso2 || iso2.length!==2 || !/^[A-Z]{2}$/.test(iso2)) return "";
  return String.fromCodePoint(...[...iso2].map(ch => 0x1F1E6 + ch.charCodeAt(0) - 65));
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
let colorScale, noDataColor;
function buildColors(){
  colorScale = d3.scaleLinear().domain([0,25,50,75,100])
    .range(["--c0","--c1","--c2","--c3","--c4"].map(cssVar)).interpolate(d3.interpolateLab).clamp(true);
  noDataColor = cssVar("--nodata");
}
const colorOf = s => (s==null ? noDataColor : colorScale(s));

/* ---------- scoring ---------- */
function compute(){
  const total = ORDER.reduce((a,k)=>a+(+W[k]||0),0);
  scores.clear(); ranks.clear();
  if(total <= 0) return;
  DATA.countries.forEach(c => {
    let s=0, w=0;
    ORDER.forEach(k => { const wk=+W[k]||0; const f=c.f && c.f[k]; if(wk>0 && f!=null){ s+=wk*f; w+=wk; } });
    scores.set(c.iso3, (w/total >= 0.6) ? Math.round(s/w) : null);
  });
  // rank scores to 0..100 relative stretch is NOT applied: score = weighted percentile average
  const sorted = [...scores].filter(d=>d[1]!=null).sort((a,b)=>b[1]-a[1]);
  sorted.forEach((d,i)=>ranks.set(d[0], i+1));
  ranks.n = sorted.length;
}

/* ---------- UI: texts & sliders ---------- */
function applyTexts(){
  document.documentElement.lang = lang;
  document.title = t("title") + " — " + (lang==="ru"?"карта стран":lang==="es"?"mapa de países":"country map");
  document.querySelectorAll("[data-i]").forEach(el => { const v = t(el.dataset.i); if(typeof v==="string") el.textContent = v; });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l===lang));
  if(DATA) $("#gen").textContent = t("generated") + " " + DATA.generated;

}
function buildPresets(){
  const box = $("#presets"); box.innerHTML = "";
  Object.keys(PRESETS).forEach(p => {
    const b = document.createElement("button");
    b.textContent = t("presets")[p];
    b.classList.toggle("on", ORDER.every(k => PRESETS[p][k] === +W[k]));
    b.onclick = () => { W = Object.assign({}, PRESETS[p]); save("kp_w", W); buildPresets(); buildSliders(); update(true); };
    box.appendChild(b);

}
function buildSliders(){
  const box = $("#sliders"); box.innerHTML = "";
  ORDER.forEach(k => {
    const [name, sub] = t("f")[k];
    const d = document.createElement("div"); d.className = "f" + (+W[k]===0?" off":"");
    d.innerHTML = `<div class="f-top"><label class="f-name" for="s_${k}">${name}</label><span class="f-val"><b>${W[k]}</b> / 5</span></div>
      <div class="f-sub">${sub}</div>
      <input id="s_${k}" type="range" min="0" max="5" step="1" value="${W[k]}" style="--p:${W[k]*20}%" aria-valuetext="${W[k]} / 5">
      <div class="scale-lbl"><span>${t("low")}</span><span>${t("high")}</span></div>`;
    const inp = d.querySelector("input");
    inp.addEventListener("input", () => {
      W[k] = +inp.value; inp.style.setProperty("--p", W[k]*20+"%");
      d.querySelector(".f-val b").textContent = W[k]; d.classList.toggle("off", W[k]===0);
      inp.setAttribute("aria-valuetext", W[k]+" / 5");
      save("kp_w", W); markPresets(); update(true);
    });

  });
}
function markPresets(){
  const btns = $("#presets").querySelectorAll("button");
  Object.keys(PRESETS).forEach((p,i)=> btns[i] && btns[i].classList.toggle("on", ORDER.every(k => PRESETS[p][k] === +W[k])));
}

/* ---------- map ---------- */
async function loadGeometry(){
  // 1) world-atlas TopoJSON (numeric ISO ids) — works on GitHub Pages
  try{
    const r = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json");
    if(!r.ok) throw new Error(r.status);
    const topo = await r.json();
    return topojson.feature(topo, topo.objects.countries).features.map(f => {
      f.iso3 = DATA.num_to_iso3[String(f.id).padStart(3,"0")] || null; return f; });
  }catch(e){ /* fall through */ }
  // 2) fallback: datamaps bundle as a script (ISO3 ids)
  await new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/datamaps@0.5.9/dist/datamaps.world.min.js";
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
  const topo = window.Datamap.prototype.worldTopo;
  const key = Object.keys(topo.objects)[0];
  return topojson.feature(topo, topo.objects[key]).features.map(f => { f.iso3 = f.id; return f; });
}

function setupMap(){
  svg = d3.select("#map");
  const box = $("#mapbox");
  width = Math.max(320, box.clientWidth);
  const land = {type:"FeatureCollection", features};
  projection = d3.geoNaturalEarth1();
  projection.fitWidth(width - 16, land);
  path = d3.geoPath(projection);
  const b = path.bounds(land);
  height = Math.ceil(b[1][1] - b[0][1] + 16);
  projection.translate([projection.translate()[0] + 8 - b[0][0] + 0, projection.translate()[1] + 8 - b[0][1]]);
  svg.attr("viewBox", `0 0 ${width} ${height}`);
  svg.selectAll("*").remove();

  const root = svg.append("g");
  gMap = root.append("g");
  gMap.append("path").datum(d3.geoGraticule10()).attr("class","grat").attr("d", path);
  gMap.selectAll("path.country").data(features, d => d.iso3 || d.id).join("path")
    .attr("class","country").attr("d", path)
    .attr("fill", noDataColor)
    .style("opacity", 0)
    .on("pointerenter", onEnter).on("pointermove", onMove).on("pointerleave", onLeave)
    .on("click", onClick);
  const have = new Set(features.map(f => f.iso3));
  dots = DATA.countries.filter(c => !have.has(c.iso3) && DOTS[c.iso3]).map(c => ({iso3:c.iso3, xy:projection(DOTS[c.iso3])}));
  gDots = root.append("g");
  gDots.selectAll("g.dot").data(dots, d => d.iso3).join("g").attr("class","dot")
    .attr("transform", d => `translate(${d.xy})`)
    .append("circle").attr("class","country").attr("r", 3.6).attr("fill", noDataColor).style("opacity", 0)
    .on("pointerenter", onEnter).on("pointermove", onMove).on("pointerleave", onLeave).on("click", onClick);
  gPins = root.append("g").attr("class","pins");
  gFx = svg.append("g"); // screen-space effects (ripples)

  zoom = d3.zoom().scaleExtent([1, 10]).translateExtent([[0,0],[width,height]])
    .on("zoom", ev => { root.attr("transform", ev.transform);
      gDots.selectAll("g.dot").attr("transform", d => `translate(${d.xy})scale(${1/ev.transform.k})`); gPins.selectAll("g.pin").attr("transform", d => `translate(${d.xy})scale(${1/ev.transform.k})`); });
  svg.call(zoom).on("dblclick.zoom", null);
  svg.on("click.bg", ev => { if(ev.target === svg.node()) closeCard(); });

  // intro: countries appear in a west→east wave
  const xs = features.map(f => path.centroid(f)[0]);
  gDots.selectAll("circle.country").transition("intro").duration(REDUCED?0:500).delay(REDUCED?0:1100).style("opacity",1);
  gMap.selectAll("path.country")
    .transition("intro").duration(REDUCED?0:700).delay((d,i) => REDUCED?0:(xs[i]/width)*900 + Math.random()*120)
    .ease(d3.easeCubicOut).style("opacity", 1);
}

function update(animate){
  compute();
  const dur = animate && !REDUCED ? 650 : 0;
  gMap.selectAll("path.country").transition("fill").duration(dur)
    .delay(d => dur ? (path.centroid(d)[0]/width)*260 : 0)
    .attr("fill", d => colorOf(scores.get(d.iso3)));
  gDots.selectAll("circle.country").transition("fill").duration(dur)
    .delay(d => dur ? (d.xy[0]/width)*260 : 0)
    .attr("fill", d => colorOf(scores.get(d.iso3)));
  drawPins(); renderTop();
  if(selected) renderCard(selected, false);
}

function drawPins(){
  const top = [...ranks].sort((a,b)=>a[1]-b[1]).slice(0,3).map(d=>d[0]);
  const items = top.map((iso,i) => {
    const f = features.find(x => x.iso3 === iso);
    if(!f){ const dt = dots.find(x => x.iso3 === iso); return dt ? {iso, i, xy: dt.xy} : null; }
    // biggest polygon centroid for multi-part countries
    let g = f.geometry, best = f;
    if(g.type === "MultiPolygon"){
      let ma = -1; g.coordinates.forEach(c => { const p = {type:"Polygon",coordinates:c}; const a = path.area(p); if(a>ma){ma=a; best=p;} });
    }
    return {iso, i, xy: path.centroid(best)};
  }).filter(Boolean);
  const k = d3.zoomTransform(svg.node()).k;
  const pins = gPins.selectAll("g.pin").data(items, d => d.iso);
  pins.exit().transition().duration(250).style("opacity",0).remove();
  const enter = pins.enter().append("g").attr("class","pin").style("opacity",0);
  enter.append("circle").attr("class","halo").attr("r",4);
  enter.append("circle").attr("class","core").attr("r",4);
  enter.append("text").attr("x",8).attr("y",4);
  const all = enter.merge(pins);
  all.attr("transform", d => `translate(${d.xy})scale(${1/k})`)
     .select("text").text(d => (d.i+1) + ". " + cname(byIso.get(d.iso)));
  all.transition().duration(REDUCED?0:400).style("opacity",1);
}

/* ---------- interactions ---------- */
const tip = $("#tip");
function onEnter(ev, d){
  const el = d3.select(this); el.classed("hov", true);
  if(this.tagName === "path"){ el.raise(); gMap.selectAll("path.country.sel").raise(); }
  showTip(ev, d);
}
function onMove(ev, d){ showTip(ev, d); }
function onLeave(){ d3.select(this).classed("hov", false); tip.classList.remove("on"); }
function showTip(ev, d){
  const c = byIso.get(d.iso3);
  const name = c ? cname(c) : (d.properties && d.properties.name) || "—";
  const s = scores.get(d.iso3), r = ranks.get(d.iso3);
  tip.innerHTML = `<b>${flag(c && c.iso2)} ${name}</b><br><span class="m">${
    s!=null ? `${t("match")} ${s}% · ${t("rank")} ${r} ${t("of")} ${ranks.n}` : (c? t("notEnough") : t("noData"))}</span>`;
  const box = $("#mapbox").getBoundingClientRect();
  let x = ev.clientX - box.left + 14, y = ev.clientY - box.top + 14;
  const tw = tip.offsetWidth || 180;
  if(x + tw > box.width - 8) x = ev.clientX - box.left - tw - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px"; tip.classList.add("on");
}
function ripple(ev){
  if(REDUCED) return;
  const [x,y] = d3.pointer(ev, svg.node());
  [0,140].forEach(delay => gFx.append("circle").attr("class","ring").attr("cx",x).attr("cy",y).attr("r",2)
    .attr("stroke-width",2).style("opacity",.8)
    .transition().delay(delay).duration(700).ease(d3.easeCubicOut).attr("r",38).style("opacity",0).remove());
}
function onClick(ev, d){
  ev.stopPropagation(); ripple(ev);
  if(!byIso.get(d.iso3)) return;
  select(d.iso3, true);
}
function select(iso, zoomTo){
  selected = iso;
  svg.selectAll(".country").classed("sel", f => f.iso3 === iso);
  gMap.selectAll("path.country.sel").raise();
  const f = features.find(x => x.iso3 === iso), dt = dots.find(x => x.iso3 === iso);
  if(zoomTo && f) zoomToFeature(f);
  else if(zoomTo && dt) zoomToPoint(dt.xy, 5);
  renderCard(iso, true);
}
function cardOffset(){ return window.innerWidth > 980 ? 360 * (width / $("#mapbox").clientWidth) : 0; }
function zoomToPoint([cx,cy], k){
  const availW = width - cardOffset();
  svg.transition().duration(REDUCED?0:850).ease(d3.easeCubicInOut)
    .call(zoom.transform, d3.zoomIdentity.translate(availW/2 - k*cx, height/2 - k*cy).scale(k));
}
function zoomToFeature(f){
  let g = f;
  if(f.geometry.type === "MultiPolygon"){ // zoom to the largest landmass (avoids e.g. France + Guiana)
    let ma=-1; f.geometry.coordinates.forEach(c=>{ const p={type:"Polygon",coordinates:c}; const a=path.area(p); if(a>ma){ma=a; g=p;} });
  }
  const [[x0,y0],[x1,y1]] = path.bounds(g);
  const availW = width - cardOffset();
  const k = Math.max(1, Math.min(6, 0.7 / Math.max((x1-x0)/availW, (y1-y0)/height)));
  zoomToPoint([(x0+x1)/2, (y0+y1)/2], k);
}
function closeCard(){
  selected = null; $("#card").classList.remove("on");
  svg.selectAll(".country").classed("sel", false);
}
$("#zin").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.6);
$("#zout").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1/1.6);
$("#zreset").onclick = () => { closeCard(); svg.transition().duration(REDUCED?0:700).call(zoom.transform, d3.zoomIdentity); };
document.addEventListener("keydown", e => { if(e.key === "Escape") closeCard(); });

/* ---------- card ---------- */
function fmtInd(key, v){
  if(key==="price_level_vs_usa") return nf(v*100,0) + "%";
  if(key==="gdp_pc_ppp") return "$" + nf(v,0);
  if(key==="pisa") return nf(v,0);
  if(["homicides_100k","gdp_growth","inflation","unemployment","vulnerable_employment","infant_mortality"].includes(key)) return nf(v,1);
  return nf(v,0);
}
function renderCard(iso, animate){
  const c = byIso.get(iso); if(!c) return;
  const s = scores.get(iso), r = ranks.get(iso);
  const R = 30, C = 2*Math.PI*R, pct = s==null ? 0 : s/100;
  const used = new Set();
  let factorsHtml = ORDER.map(k => {
    const fv = c.f ? c.f[k] : null; const off = (+W[k]||0) === 0;
    return `<div class="fb${off?" off":""}"><span>${t("f")[k][0]}</span>
      <div class="track"><div class="fill" data-w="${fv==null?0:fv}" style="background:${colorOf(fv)}"></div></div>
      <span class="n">${fv==null?"—":fv}</span></div>`;
  }).join("");
  let indHtml = ORDER.map(k => DATA.factors[k].map(([ik]) => {
    if(used.has(ik)) return ""; used.add(ik);
    const val = c.v && c.v[ik]; if(!val) return "";
    const src = (c.src && c.src[ik]) || DATA.indicators[ik].src;
    let extra = "";
    if(ik==="pisa" && c.pisa3) extra = ` (${t("pisaParts")}: ${c.pisa3.join(" / ")})`;
    return `<div class="ind"><span>${t("ind")[ik]}</span><span class="v">${fmtInd(ik, val[0])}</span>
      <span class="meta">${t("year")} ${val[1]} · ${SRC[src]||src}${extra}</span></div>`;
  }).join("")).join("");
  const card = $("#card");
  card.innerHTML = `<button class="x" aria-label="Close">×</button>
    <h3><span class="flag">${flag(c.iso2)}</span>${cname(c)}</h3>
    <div class="score">
      <svg class="donut" viewBox="0 0 74 74"><circle cx="37" cy="37" r="${R}" fill="none" stroke="var(--line)" stroke-width="8"/>
        <circle class="arc" cx="37" cy="37" r="${R}" fill="none" stroke="${colorOf(s)}" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${animate?C:C*(1-pct)}" transform="rotate(-90 37 37)" style="transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)"/>
        <text x="37" y="43" text-anchor="middle">${s==null?"—":s}</text></svg>
      <div class="rk">${s==null ? t("notEnough") : `${t("match")}<b>${t("rank")} ${r} ${t("of")} ${ranks.n}</b>`}</div>
    </div>
    <div class="sec">${t("factors")}</div>${factorsHtml}
    <div class="sec">${t("indicators")}</div>${indHtml}
    ${c.partial ? `<div class="note">${t("partial")}</div>` : ""}`;
  card.querySelector(".x").onclick = closeCard;
  card.classList.add("on");
  requestAnimationFrame(() => requestAnimationFrame(() => {
    card.querySelectorAll(".fill").forEach(el => el.style.width = el.dataset.w + "%");
    const arc = card.querySelector(".arc"); if(arc) arc.style.strokeDashoffset = C*(1-pct);
  }));
}

/* ---------- top list ---------- */
function renderTop(){
  const box = $("#top");
  if(!ranks.n){ box.innerHTML = `<div class="empty">${t("noWeights")}</div>`; return; }
  const top = [...ranks].sort((a,b)=>a[1]-b[1]).slice(0,10);
  box.innerHTML = "<ol>" + top.map(([iso,r]) => { const c = byIso.get(iso), s = scores.get(iso);
    return `<li data-iso="${iso}"><span class="i">${r}</span><span class="nm">${flag(c.iso2)} ${cname(c)}<small data-w="${s}"></small></span><span class="pc">${s}%</span></li>`; }).join("") + "</ol>";
  box.querySelectorAll("li").forEach(li => {
    li.onclick = () => select(li.dataset.iso, true);
    li.onmouseenter = () => svg.selectAll(".country").filter(f => f.iso3 === li.dataset.iso).classed("hov", true);
    li.onmouseleave = () => svg.selectAll(".country.hov").classed("hov", false);
  });
  requestAnimationFrame(() => requestAnimationFrame(() =>
    box.querySelectorAll("small").forEach(el => el.style.width = el.dataset.w + "%")));
}

/* ---------- boot ---------- */
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.l; save("kp_lang", lang); applyTexts(); renderTop(); drawPins();
  if(selected) renderCard(selected, false);
});
buildColors();
applyTexts();
if(window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { buildColors(); update(false); if(selected) renderCard(selected,false); });

(async function(){
  try{
    const r = await fetch("data/countries.json"); DATA = await r.json();
    DATA.countries.forEach(c => byIso.set(c.iso3, c));
    $("#gen").textContent = t("generated") + " " + DATA.generated;
    features = (await loadGeometry()).filter(f => f.iso3 !== "ATA" && f.id !== "010");
    $("#loading").remove();
    setupMap(); update(false);
    let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => {
      const keep = selected; setupMap(); update(false); svg.selectAll(".country").interrupt("intro").style("opacity",1);
      if(keep) select(keep, false); }, 250); });
  }catch(e){
    console.error(e);
    $("#loading").textContent = "Error: " + e.message;
  }
})();
})();
</script>
</body>
</html>
